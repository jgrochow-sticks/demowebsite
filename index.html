<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Galleries</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
            text-align: center;
        }
        header { margin-bottom: 50px; }
        header h1 { font-size: 2.5rem; color: #111; margin-bottom: 10px; }
        header p { color: #666; font-size: 1.1rem; }

        .galleries-grid {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .gallery-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.1);
        }

        .card-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover .card-image img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 20px;
            text-align: left;
        }

        .card-content h2 { font-size: 1.3rem; margin-bottom: 8px; color: #222; }
        .card-content p { font-size: 0.95rem; color: #666; }

        footer { margin-top: 60px; color: #888; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <h1>My Photo Galleries</h1>
        <p>Select a collection to view all photos inside.</p>
    </header>

    <main class="galleries-grid">
        <!-- Gallery 1 Link Card -->
        <a href="gallery1/index.html" class="gallery-card">
            <div class="card-image">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Gallery 1 Cover">
            </div>
            <div class="card-content">
                <h2>Gallery 1: Landscapes</h2>
                <p>Explore breathtaking views of mountains, valleys, and horizons.</p>
            </div>
        </a>

        <!-- Gallery 2 Link Card -->
        <a href="gallery2/index.html" class="gallery-card">
            <div class="card-image">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05" alt="Gallery 2 Cover">
            </div>
            <div class="card-content">
                <h2>Gallery 2: Forests & Nature</h2>
                <p>A quiet look into wooded paths and lush greenery.</p>
            </div>
        </a>
    </main>

    <footer>
        <p>&copy; 2026 My Photo Galleries</p>
    </footer>

</body>
</html>
