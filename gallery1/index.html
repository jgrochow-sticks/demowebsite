<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery 1 - Landscapes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 30px 20px;
        }
        .nav-back {
            display: inline-block;
            margin-bottom: 20px;
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
        }
        .nav-back:hover { text-decoration: underline; }
        
        header { margin-bottom: 30px; }
        header h1 { font-size: 2rem; margin-bottom: 5px; }
        header p { color: #666; }

        .thumbnail-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .thumb-item {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
        }

        .thumb-img-wrapper {
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .thumb-item:hover img { transform: scale(1.04); }
        .thumb-caption { padding: 12px; font-size: 0.95rem; font-weight: 500; text-align: center; }
    </style>
</head>
<body>

    <a href="../index.html" class="nav-back">&larr; Back to Home</a>

    <header>
        <h1>Gallery 1: Landscapes</h1>
        <p>Sample images stored in the Gallery 1 folder.</p>
    </header>

    <div class="thumbnail-grid">
        <div class="thumb-item">
            <div class="thumb-img-wrapper">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Mountain Peak">
            </div>
            <div class="thumb-caption">Mountain Peak at Sunset</div>
        </div>
        <div class="thumb-item">
            <div class="thumb-img-wrapper">
                <img src="https://images.unsplash.com/photo-1426604966848-d7adac902bff" alt="Green Valley">
            </div>
            <div class="thumb-caption">Lush Valley View</div>
        </div>
    </div>

</body>
</html>
